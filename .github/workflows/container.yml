name: Test and publish container

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            admin/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.6.2

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Test admin
        working-directory: admin
        run: npm test

      - name: Lint admin
        working-directory: admin
        run: npm run lint

      - name: Build admin
        working-directory: admin
        run: npm run build

  publish:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs:
      - test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/whitekw/bside:master
            ghcr.io/whitekw/bside:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout application
        uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: whitekw/gitops
          ref: master
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update and commit deployment image
        shell: bash
        env:
          IMAGE_REF: ghcr.io/whitekw/bside:sha-${{ github.sha }}@${{ needs.publish.outputs.digest }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          git -C gitops config user.name "github-actions[bot]"
          git -C gitops config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            latest="$(git -C source ls-remote --exit-code origin refs/heads/master | cut -f1)"
            if [ "$latest" != "$GITHUB_SHA" ]; then
              echo "Skipping superseded application commit."
              exit 0
            fi

            git -C gitops fetch origin master
            git -C gitops reset --hard origin/master

            python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("gitops/stacks/bside/compose.yaml")
          content = path.read_text()
          pattern = r'(?m)^    image:[ \t]*["\']?ghcr\.io/whitekw/(?:jukebox|bside)(?=[:@\s\"\x27]|$)[^\r\n]*$'
          updated, count = re.subn(pattern, lambda _: '    image: "' + os.environ["IMAGE_REF"] + '"', content)
          if count != 1:
              raise SystemExit(f"Expected one bside deployment image, found {count}")
          path.write_text(updated)
          PY

            docker compose -f gitops/stacks/bside/compose.yaml config --no-interpolate --quiet

            if git -C gitops diff --quiet -- stacks/bside/compose.yaml; then
              echo "Deployment image is already up to date."
              exit 0
            fi

            git -C gitops add stacks/bside/compose.yaml
            git -C gitops commit -m "Deploy bside ${GITHUB_SHA}"
            if git -C gitops push origin HEAD:master; then
              echo "Updated GitOps manifest. Komodo deployment is configured separately."
              exit 0
            fi
            echo "Push failed; retrying against latest GitOps branch ($attempt/3)."
          done
          echo "::error::Unable to update GitOps after three attempts."
          exit 1
